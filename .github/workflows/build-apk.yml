name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Extract game project
        run: |
          mkdir game
          unzip -q *.zip -d game
          find game -name package.json

      - name: Install dependencies and build
        run: |
          cd game
          PROJECT_DIR=$(dirname "$(find . -name package.json | head -1)")
          cd "$PROJECT_DIR"
          npm ci
          npm run cap:build

      - name: Build APK
        run: |
          cd game
          PROJECT_DIR=$(dirname "$(find . -name package.json | head -1)")
          cd "$PROJECT_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WAR-GAME-APK
          path: game/**/android/app/build/outputs/apk/debug/*.apk
